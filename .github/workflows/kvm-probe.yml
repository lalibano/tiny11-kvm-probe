name: Build preinstalled Tiny11 image

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run only the KVM probe or build the preinstalled image
        required: true
        default: probe
        type: choice
        options:
          - probe
          - build
      iso_dataset:
        description: Private Kaggle dataset containing the Tiny11 ISO
        required: true
        default: willysill/tiny11-core-25h2-iso
        type: string
      publish_dataset:
        description: Publish the qcow2 to a private Kaggle dataset
        required: true
        default: false
        type: boolean
      target_dataset:
        description: Kaggle dataset ID for the built qcow2
        required: true
        default: willysill/tiny11-preinstalled-qcow2
        type: string

jobs:
  kvm-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: Require KVM
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          stat /dev/kvm
          qemu-system-x86_64 --version
          set +e
          timeout 10s qemu-system-x86_64 \
            -accel kvm \
            -machine pc \
            -cpu qemu64 \
            -m 256M \
            -nodefaults \
            -display none \
            -S
          rc=$?
          set -e
          test "$rc" -eq 124
          echo 'KVM smoke test passed.'

  build:
    if: ${{ inputs.mode == 'build' }}
    needs: kvm-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install QEMU and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils dosfstools mtools genisoimage
          # /dev/kvm is present on the hosted runner but may not be writable by the runner user.
          sudo chmod 666 /dev/kvm
          stat /dev/kvm

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Download the private Tiny11 ISO
        env:
          KAGGLE_DATASET: ${{ inputs.iso_dataset }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ] && { [ -z "${KAGGLE_USERNAME:-}" ] || [ -z "${KAGGLE_KEY:-}" ]; }; then
            echo 'Add KAGGLE_API_TOKEN, or KAGGLE_USERNAME and KAGGLE_KEY, to this repository Actions secrets.' >&2
            exit 1
          fi
          mkdir -p build/input
          kaggle datasets download -d "$KAGGLE_DATASET" -p build/input --unzip
          ISO="$(find build/input -type f -iname '*.iso' -print -quit)"
          test -n "$ISO"
          stat -c 'ISO: %n (%s bytes)' "$ISO"
          printf '%s\n' "$ISO" > build/iso-path.txt

      - name: Generate unattended setup media
        env:
          BOOTSTRAP_PASSWORD: ${{ secrets.TINY11_BUILD_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build
          python scripts/make_autounattend.py build/Autounattend.xml

      - name: Inspect ISO boot metadata
        run: |
          set -euo pipefail
          ISO="$(cat build/iso-path.txt)"
          file "$ISO"
          isoinfo -d -i "$ISO" || true
          echo 'ISO boot and setup files:'
          isoinfo -f -i "$ISO" | grep -Ei '(/EFI/|/BOOT/|INSTALL\.WIM|INSTALL\.ESD)' | head -80 || true

      - name: Build the preinstalled qcow2 with KVM
        run: |
          set -euo pipefail
          python scripts/build_windows_image.py \
            --iso "$(cat build/iso-path.txt)" \
            --autounattend build/Autounattend.xml \
            --output build/tiny11-preinstalled.qcow2 \
            --workdir build/qemu \
            --timeout 18000

      - name: Publish the qcow2 to a private Kaggle dataset
        if: ${{ inputs.publish_dataset }}
        env:
          KAGGLE_DATASET: ${{ inputs.target_dataset }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p build/publish
          cp build/tiny11-preinstalled.qcow2 build/publish/
          python - <<'PY'
          import json, os
          from pathlib import Path
          dataset_id = os.environ['KAGGLE_DATASET']
          owner, slug = dataset_id.split('/', 1)
          meta = {
              'title': 'Tiny11 preinstalled QEMU disk',
              'id': dataset_id,
              'subtitle': 'Private preinstalled Tiny11 qcow2 for Kaggle QEMU',
              'description': 'Generated by GitHub Actions with KVM. Do not publish credentials or Tailscale keys in this dataset.',
              'licenses': [{'name': 'other'}],
              'isPrivate': True,
          }
          Path('build/publish/dataset-metadata.json').write_text(json.dumps(meta, indent=2))
          PY
          # The first run creates the dataset. Later runs can use `kaggle datasets version`.
          kaggle datasets create -p build/publish --dir-mode zip

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny11-build-diagnostics
          path: |
            build/qemu/serial.log
            build/qemu/qemu.stderr.log
            build/qemu/screen.ppm
            build/iso-path.txt
          if-no-files-found: ignore
